name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check whether this version is already published
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if output=$(npm view "${name}@${version}" version 2>&1); then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$output" | grep -q E404; then
            if [ ! -s "docs/releases/${version}.md" ]; then
              echo "docs/releases/${version}.md is missing or empty. Write the release notes before releasing ${version}."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$output"
            exit 1
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        run: npm run lint
      - if: steps.version.outputs.publish == 'true'
        run: npm run typecheck
      - if: steps.version.outputs.publish == 'true'
        run: npm test
      - if: steps.version.outputs.publish == 'true'
        run: npm run build
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create the GitHub release when it is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if ! output=$(npm view "${name}@${version}" version 2>&1); then
            printf '%s\n' "$output"
            echo "${name}@${version} is not on npm, so no release is created for it. Run this workflow again once the version is published."
            exit 1
          fi
          if gh release view "v${version}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The release v${version} already exists."
            exit 0
          fi
          if [ ! -s "docs/releases/${version}.md" ]; then
            echo "docs/releases/${version}.md is missing or empty. Write the release notes before releasing ${version}."
            exit 1
          fi
          gh release create "v${version}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${version}" \
            --notes-file "docs/releases/${version}.md"
